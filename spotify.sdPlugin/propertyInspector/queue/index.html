<body>
    <div class="sdpi-wrapper" style="padding: 10px; font-family: sans-serif; font-size: 12px; color: #ccc;">
        <div class="sdpi-heading" style="font-weight: bold; margin-bottom: 6px;">Spotify Hotkey</div>
        <p>No configuration needed. Pressing the button focuses Spotify.exe, sends <b>Alt+Shift+Q</b>, then returns to the window you were using.</p>
        <p>If Spotify is minimized to the tray (no visible window), nothing happens.</p>
