<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>SYNK Volume - Property Inspector</title>
    <link rel="stylesheet" href="../../static/css/sdpi.css">
</head>

<body>
    <div class="sdpi-wrapper" style="display: none">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Passo</div>
            <select class="sdpi-item-value" id="step">
                <option value="1">1% por clique</option>
                <option value="2">2% por clique</option>
                <option value="5">5% por clique</option>
                <option value="10">10% por clique</option>
            </select>
        </div>
        <p style="font-size: 11px; color: #aaa; padding: 0 8px;">Gire para mudar o volume dos efeitos do SYNK. Pressione para silenciar.</p>
    </div>
    <script src="../utils/common.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>
</body>

</html>
